[project]
name = "letzscan"
version = "0.1.0"
description = "LëtzScan data pipeline: connectors, canonical contracts, derivations and releases."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "jsonschema>=4.26",
    "pydantic>=2.13",
    "pyyaml>=6.0.3",
]

[project.scripts]
letzscan = "letzscan.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/letzscan"]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "A",    # builtins shadowing
    "C4",   # comprehensions
    "DTZ",  # timezone-aware datetimes: naive datetimes are a data-quality bug here
    "PTH",  # pathlib
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

id: act-geoportail-basemap
title: ACT Carte de base
source_id: act-geoportail-basemap

# WMTS layer `basemap`, matrix set GLOBAL_WEBMERCATOR, from
# https://wmts1.geoportail.lu/opendata/wmts/1.0.0/WMTSCapabilities.xml.
tiles:
  - https://wmts1.geoportail.lu/opendata/wmts/basemap/GLOBAL_WEBMERCATOR/{z}/{x}/{y}.png
tile_size: 256
min_zoom: 0
max_zoom: 19

status: active

notes: >-
  Chosen because ACT designed it as a quiet base for thematic overlays ("avec un
  minimum de couleurs de façon à permettre une superposition d'informations
  thématiques"), it needs no key, and it is the national mapping agency's own
  product. See docs/adr/0008-basemap.md and the source entry for the licence
  evidence.

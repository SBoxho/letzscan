name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI verifies. It does not deploy — see docs/adr/0004.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  frontend:
    name: TypeScript (web, edge, contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

  python:
    name: Python pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --directory pipeline --locked

      - name: Lint
        run: |
          uv run --directory pipeline ruff check .
          uv run --directory pipeline ruff format --check .

      - name: Tests
        run: uv run --directory pipeline pytest

  contracts:
    name: Schemas and catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --directory pipeline --locked

      # Zod is the source of truth; a stale schemas/ directory means the two
      # runtimes have drifted.
      - name: Generated schemas are current
        run: npm run schemas:check

      - name: Catalogue is valid
        run: npm run catalog:validate

  hygiene:
    name: Credential hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: No secrets in the working tree
        run: node scripts/check-secrets.mjs
